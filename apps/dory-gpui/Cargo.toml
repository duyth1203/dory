[package]
name = "dory-gpui"
version = "0.2.2"
description = "The native Dory app on GPUI."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "dory-gpui"
path = "src/main.rs"

[dependencies]
dory.workspace = true
dory-core.workspace = true
gpui-kit = "=0.9.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSLocale", "NSDictionary", "NSValue", "NSBundle", "NSError", "NSObject", "NSThread", "NSNotification", "NSOperation", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSColor", "NSColorSpace", "NSAccessibility", "NSAccessibilityConstants", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSWindow", "NSRunningApplication", "NSCell", "NSButtonCell", "NSActionCell", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSWorkspace", "NSAccessibilityProtocols"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNError", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }
dory-core = { workspace = true, features = ["testing"] }
usvg = { version = "0.46", default-features = false }

[lints]
workspace = true
