[workspace]
resolver = "3"
members = [
    "crates/dory",
    "crates/dory-assistants",
    "crates/dory-core",
    "crates/dory-engines",
    "crates/dory-store",
    "crates/dory-macos",
    "apps/dory-cli",
    "apps/dory-mcp",
    "apps/dory-gpui",
]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
dory = { path = "crates/dory" }
dory-assistants = { path = "crates/dory-assistants" }
dory-core = { path = "crates/dory-core" }
dory-engines = { path = "crates/dory-engines" }
dory-macos = { path = "crates/dory-macos" }
dory-store = { path = "crates/dory-store" }
thiserror = "2"
crossbeam-channel = "0.5"
async-channel = "2"
rtrb = "0.4"
unicode-normalization = "0.1.25"
hound = "3.5"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
flacenc = "0.5"
claxon = "0.4"
rubato = "=5.0.1"
tempfile = "3"
sha2 = "=0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.5.2", features = ["json"] }
sherpa-onnx = "=2.0.1"
bzip2 = "0.6"
tar = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[patch.crates-io]
sherpa-onnx = { path = "vendor/sherpa-onnx" }
gpui-component = { path = "vendor/gpui-component" }

[profile.release]
# Until P7 proves the accessibility tree stable, a panic in a view unwinds instead of aborting.
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
