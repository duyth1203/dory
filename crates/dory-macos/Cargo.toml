[package]
name = "dory-macos"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Builds swift/DoryAI.swift and the `ai` module over it. `dory`'s `app` feature turns it on. A
# binary that links it must target macOS 12 or later, which the workspace's `.cargo/config.toml`
# does with MACOSX_DEPLOYMENT_TARGET 26.0: below 12 the Swift concurrency runtime links as
# `@rpath/libswift_Concurrency.dylib`.
apple-intelligence = []

[dependencies]
dory-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = "0.6.3"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVAudioBuffer", "AVAudioEngine", "AVAudioFile", "AVAudioFormat", "AVAudioMixerNode", "AVAudioNode", "AVAudioPlayerNode", "AVAudioTime", "AVAudioTypes"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "block2", "dispatch2", "objc2", "objc2-core-audio-types", "objc2-foundation", "HostTime"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFString", "CFNumber", "CFArray"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSValue", "NSUUID", "NSString", "NSProcessInfo", "NSURL", "NSError", "NSFileManager"] }

# The capture harness (`examples/dory-capture`) writes WAV files and stops on Ctrl-C.
[target.'cfg(target_os = "macos")'.dev-dependencies]
ctrlc = "3.5.2"
hound.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "dory-capture"
path = "examples/dory-capture/main.rs"
test = true

[[test]]
name = "foundation_models_live"
required-features = ["apple-intelligence"]

[[test]]
name = "speech_live"
required-features = ["apple-intelligence"]

[lints]
workspace = true
