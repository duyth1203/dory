[package]
name = "dory-mcp"
version = "0.2.0"
description = "Dory's MCP server: lets an assistant search and read the user's meetings, read-only, over stdio."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dory = { path = "../../crates/dory", default-features = false }
dory-core.workspace = true
rmcp = { version = "=3.10.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "time"] }
serde.workspace = true
serde_json.workspace = true
schemars = "1"

[dev-dependencies]
dory = { path = "../../crates/dory" }
dory-store.workspace = true
tempfile.workspace = true

[lints]
workspace = true
